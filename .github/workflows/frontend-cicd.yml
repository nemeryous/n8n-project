name: CI/CD for React Vite Project

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  pull_request:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch: # Cho phép trigger thủ công từ GitHub UI

jobs:
  quality-checks:
    name: 🕵️ Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🕵️ Run ESLint
        run: npm run lint

      - name: 💄 Run Prettier Check
        run: npm run format:check

      - name: 🧪 Run Tests
        run: npm run test -- --run

  build:
    defaults:
      run:
        working-directory: frontend
    name: 🏗️ Build Project

    runs-on: ubuntu-latest

    needs: quality-checks
    if: github.ref == 'refs/heads/main'

    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Run Build
        run: npm run build

      - name: 💾 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: frontend/dist

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest

    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 💾 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          source: "dist/*"
          target: "/var/www/my-app" #

          script: |
            echo "Deploy successful, reloading Nginx..."
            sudo -n systemctl reload nginx || {
              echo "❌ Error: Cannot reload nginx without password"
              echo "📝 Please configure sudoers on VPS:"
              echo "   1. SSH to VPS: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
              echo "   2. Run: sudo visudo"
              echo "   3. Add line: ${{ secrets.VPS_USER }} ALL=(ALL) NOPASSWD: /bin/systemctl reload nginx, /bin/systemctl restart nginx, /bin/systemctl status nginx"
              exit 1
            }
            echo "✅ Nginx reloaded successfully"
