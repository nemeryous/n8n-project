name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths: ["backend/**"]
  pull_request:
    branches: [ "main" ]
    paths: ["backend/**"]

jobs:
  # ========================================================
  # JOB 1: QUALITY CHECKS (Kiểm tra chất lượng & Test)
  # ========================================================
  quality:
    name: 🕵️ Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@v4
      
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 📦 Resolve Dependencies
        run: mvn dependency:go-offline

      - name: 🧪 Run Unit Tests
        run: mvn test

  # ========================================================
  # JOB 2: BUILD PROJECT (Đóng gói file JAR)
  # ========================================================
  build:
    name: 🏗 Build Project
    needs: quality  # Chỉ chạy khi Job 'quality' thành công
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@v4
      
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🏗️ Build Package
        run: |
          mvn clean package -DskipTests
          mv target/*.jar target/app.jar

      # Quan trọng: Lưu file JAR lại để chuyển sang Job Deploy
      - name: 💾 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-app
          path: backend/target/app.jar
          retention-days: 1

  # ========================================================
  # JOB 3: DEPLOY TO VPS (Đẩy lên server)
  # ========================================================
  deploy:
    name: 🚀 Deploy to VPS
    needs: build  # Chỉ chạy khi Job 'build' thành công
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # Tải file JAR từ Job 'build' về
      - name: 💾 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-app
          path: target

      - name: 📤 Copy JAR to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/app.jar"
          target: "/home/${{ secrets.VPS_USER }}/backend"
          strip_components: 1

      - name: 🔄 Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Restarting Spring Boot Service..."
            sudo systemctl restart springboot-app.service
            sleep 10
            sudo systemctl status springboot-app.service --no-pager