name: Backend CI/CD Pipeline

on:
  push:
    branches: ["main"]
    paths: ["backend/**"]
  pull_request:
    branches: ["main"]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  # ========================================================
  # JOB 1: QUALITY CHECKS (Kiểm tra chất lượng & Test)
  # ========================================================
  quality:
    name: 🕵️ Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: 📦 Resolve Dependencies
        run: mvn dependency:go-offline

      - name: 🧪 Run Unit Tests
        run: mvn test -Dspring.profiles.active=test
        env:
          SPRING_PROFILES_ACTIVE: test

  # ========================================================
  # JOB 2: BUILD PROJECT (Đóng gói file JAR)
  # ========================================================
  build:
    name: 🏗 Build Project
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: 🏗️ Build Package
        run: |
          mvn clean package -DskipTests
          mv target/*.war target/app.jar

      - name: 💾 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-app
          path: backend/target/app.jar
          retention-days: 1

  # ========================================================
  # JOB 3: DEPLOY TO VPS (Đẩy lên server)
  # ========================================================
  deploy:
    name: 🚀 Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 💾 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-app
          path: target

      - name: 📤 Copy JAR to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/app.jar"
          target: "/home/${{ secrets.VPS_USER }}/backend"
          strip_components: 1
          rm: true # Xóa file cũ trước khi copy để tránh rác

      - name: 🚀 Restart & Health Check
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔄 Restarting Spring Boot Service..."
            # Restart service
            sudo -n systemctl restart springboot-app.service || {
               echo "❌ Failed to execute restart command"
               exit 1
            }
            
            echo "⏳ Waiting for application to start (45s)..."
            # Spring Boot cần thời gian khởi động, chờ 45s
            sleep 45
            
            echo "🏥 Performing Health Check..."
            # Gọi vào API health check (hoặc root /). 
            # -s: Silent, -f: Fail on HTTP error, -o /dev/null: Bỏ qua output body
            # Nếu app lỗi (DB connection fail...), port 8080 sẽ không mở -> curl thất bại
            if curl -s -f -o /dev/null http://localhost:8080/actuator/health; then
              echo "✅ Health Check Passed! Application is running."
              exit 0
            else
              echo "❌ Health Check FAILED! Application is NOT responding."
              
              echo "📋 Fetching recent error logs (Last 50 lines)..."
              echo "----------------------------------------"
              # In log ra màn hình CI/CD để debug ngay lập tức
              sudo -n journalctl -u springboot-app.service -n 50 --no-pager
              echo "----------------------------------------"
              
              # Quan trọng: exit 1 để GitHub Actions đánh dấu job là Failed
              exit 1
            fi