name: CI/CD Backend Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------
      # BƯỚC 1: CHUẨN BỊ & TẢI THƯ VIỆN
      # ---------------------------------------------------
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # Tự động cache thư viện để lần sau chạy nhanh hơn

      - name: Download Dependencies
        # Tải toàn bộ thư viện về trước khi chạy các bước sau
        run: mvn dependency:go-offline

      # ---------------------------------------------------
      # BƯỚC 2: QUALITY CHECK (Kiểm tra chất lượng)
      # ---------------------------------------------------
      - name: Code Quality Check
        run: mvn validate

      # ---------------------------------------------------
      # BƯỚC 3: UNIT TEST (Kiểm tra logic)
      # ---------------------------------------------------
      - name: Run Unit Tests
        run: mvn test

      # ---------------------------------------------------
      # BƯỚC 4: BUILD (Đóng gói file .jar)
      # ---------------------------------------------------
      - name: Build Package
        run: |
          # Build và bỏ qua test (vì đã test ở bước trên rồi)
          mvn clean package -DskipTests
          # Đổi tên file cho gọn
          mv target/*.jar target/app.jar

      # ---------------------------------------------------
      # BƯỚC 5: DEPLOY (Đẩy lên folder backend)
      # ---------------------------------------------------
      - name: Copy JAR to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/app.jar"
          target: "/home/${{ secrets.VPS_USER }}/backend"
          strip_components: 1

      - name: Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Restart service để nhận code mới
            sudo systemctl restart springboot-app.service
            
            # Chờ 10s và kiểm tra trạng thái
            sleep 10
            sudo systemctl status springboot-app.service --no-pager