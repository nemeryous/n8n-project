# Test Profile - Sử dụng H2 in-memory database
# Không cần MySQL, chạy nhanh hơn và đơn giản hơn

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable unnecessary features for tests
spring.jpa.open-in-view=false
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Disable seeding in tests
app.seeding.enabled=false
app.seeding.product-count=0

# API Configuration
api.prefix=/api/v1

# N8N API Key
n8n.api-key=test-api-key

