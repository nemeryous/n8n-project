name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    # ---------------------------------------------------
    # 1. CHUẨN BỊ MÔI TRƯỜNG
    # ---------------------------------------------------
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # ---------------------------------------------------
    # 2. QUALITY & TEST
    # ---------------------------------------------------
    - name: Run Unit Tests
      run: mvn test
      # Nếu test lỗi, quy trình dừng ngay tại đây

    # ---------------------------------------------------
    # 3. BUILD FILE JAR
    # ---------------------------------------------------
    - name: Build Package
      run: mvn clean package -DskipTests

    - name: Rename jar file
      run: mv target/*.jar target/app.jar

    # ---------------------------------------------------
    # 4. DEPLOY (Sử dụng biến VPS_...)
    # ---------------------------------------------------
    - name: Copy JAR to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}     
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "target/app.jar"

        target: "/home/${{ secrets.VPS_USER }}/backend"
        strip_components: 1

    - name: Restart Spring Boot Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}     
        username: ${{ secrets.VPS_USER }} 
        key: ${{ secrets.VPS_SSH_KEY }}   
        script: |
          echo "Deploying to VPS..."
          # Restart lại service systemd
          sudo systemctl restart springboot-app.service
          
          # Chờ 10s và kiểm tra trạng thái
          sleep 10
          sudo systemctl status springboot-app.service --no-pager